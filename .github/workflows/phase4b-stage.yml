name: Phase 4B Stage

on:
  push:
    branches:
      - agent/phase-4b-runtime-monolith-reduction
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase4b-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4b-runtime-monolith-reduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checkpoint
        run: python scripts/phase4b/apply-checkpoint1.py
      - name: Diff sanity
        run: git diff --check
      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Full validation
        run: |
          npm run check
          npm run performance:check
      - name: Commit validated checkpoint
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No staged source changes."
            exit 0
          fi
          git config user.name "OpenAI Phase 4B"
          git config user.email "noreply@openai.com"
          git add src electron tests
          git diff --cached --check
          git commit -m "Phase 4B.1-2: harden runtime recovery and Discord RPC"
          git push origin HEAD:agent/phase-4b-runtime-monolith-reduction
