name: Phase 4B Stage

on:
  push:
    branches:
      - agent/phase-4b-runtime-monolith-reduction
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase4b-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4b-runtime-monolith-reduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checkpoints
        shell: bash
        run: |
          sed -i 's/localitfyConstants/localtifyConstants/g' scripts/phase4b/apply-checkpoint1.py
          python scripts/phase4b/apply-checkpoint1.py
          python scripts/phase4b/apply-checkpoint2.py
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          text = text.replace('import type { LocaltifyAnalyticsSnapshot } from "./features/analytics/analyticsSnapshot";\n', '')
          text = text.replace('  ONBOARDING_STORAGE_KEY,\n', '')
          text = text.replace(
              'import { applyVisualCustomizationDefaults } from "./features/settings/visualCustomization";',
              'import { applyVisualCustomizationDefaults, VISUAL_CUSTOMIZATION_DEFAULTS } from "./features/settings/visualCustomization";'
          )
          app.write_text(text, encoding='utf-8')

          visual = Path('src/features/settings/visualCustomization.ts')
          source = visual.read_text(encoding='utf-8')
          source = source.replace('const DEFAULTS = {', 'export const VISUAL_CUSTOMIZATION_DEFAULTS = {', 1)
          source = source.replace('DEFAULTS.', 'VISUAL_CUSTOMIZATION_DEFAULTS.')
          visual.write_text(source, encoding='utf-8')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Full validation
        run: |
          npm run check
          npm run performance:check
      - name: Commit validated checkpoint
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No staged source changes."
            exit 0
          fi
          git config user.name "OpenAI Phase 4B"
          git config user.email "noreply@openai.com"
          git add src electron tests
          git diff --cached --check
          git commit -m "Phase 4B.3: extract renderer policy ownership"
          git push origin HEAD:agent/phase-4b-runtime-monolith-reduction
