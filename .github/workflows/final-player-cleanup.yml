name: Final player cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup-verify-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/css-audio-stability'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch without persisted write credentials
        uses: actions/checkout@v4
        with:
          ref: agent/css-audio-stability
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finish player ownership and lifecycle cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(source.replace(old, new, 1))

          hygiene = Path('scripts/css-hygiene.mjs')
          replace_once(
              hygiene,
              '  return `${output.join("\\n").replace(/\\n{4,}/g, "\\n\\n\\n")}${newline}`.replace(/\\n/g, newline);',
              '  const normalizedBody = output.join("\\n").replace(/\\n{4,}/g, "\\n\\n\\n");\n  return `${normalizedBody.replace(/\\n/g, newline)}${newline}`;',
              'css hygiene newline assembly'
          )

          player = Path('src/features/player/usePlayerRuntime.ts')
          replace_once(
              player,
              '  const audioEffectRuntimeRef = useRef<AudioEffectRuntime | null>(null);',
              '  const audioEffectRuntimeRef = useRef<AudioEffectRuntime | null>(null);\n  if (audioEffectRuntimeRef.current === null) {\n    audioEffectRuntimeRef.current = new AudioEffectRuntime();\n  }',
              'player-owned AudioEffectRuntime initialization'
          )

          app = Path('src/App.tsx')
          replace_once(
              app,
              'import { AudioEffectRuntime } from "./features/player/audio/audioEffectRuntime";\n',
              '',
              'remove App AudioEffectRuntime import'
          )
          replace_once(
              app,
              '  function getAudioEffectRuntime() {\n    if (!audioEffectRuntimeRef.current) {\n      audioEffectRuntimeRef.current = new AudioEffectRuntime();\n    }\n    return audioEffectRuntimeRef.current;\n  }',
              '  function getAudioEffectRuntime() {\n    const runtime = audioEffectRuntimeRef.current;\n    if (!runtime) throw new Error("player audio effect runtime unavailable");\n    return runtime;\n  }',
              'remove App AudioEffectRuntime construction'
          )

          lifecycle = Path('src/app/runtime/useAppLifecycleRuntime.ts')
          replace_once(
              lifecycle,
              'import { useEffect, useRef } from "react";',
              'import { useEffect, useLayoutEffect, useRef } from "react";',
              'lifecycle useLayoutEffect import'
          )
          replace_once(
              lifecycle,
              '  const repairPlaybackAfterAppReturnsRef = useRef(repairPlaybackAfterAppReturns);\n  repairPlaybackAfterAppReturnsRef.current = repairPlaybackAfterAppReturns;\n\n  useEffect(() => {',
              '  const repairPlaybackAfterAppReturnsRef = useRef(repairPlaybackAfterAppReturns);\n\n  useLayoutEffect(() => {\n    repairPlaybackAfterAppReturnsRef.current = repairPlaybackAfterAppReturns;\n  }, [repairPlaybackAfterAppReturns]);\n\n  useEffect(() => {',
              'layout-synchronous lifecycle callback refresh'
          )

          tests = Path('tests/phase3/player-audio-runtime.test.mjs')
          source = tests.read_text()
          old = '''  const runtime = read("src/features/player/audio/audioEffectRuntime.ts");\n  const app = read("src/App.tsx");\n'''
          new = '''  const runtime = read("src/features/player/audio/audioEffectRuntime.ts");\n  const playerRuntime = read("src/features/player/usePlayerRuntime.ts");\n  const app = read("src/App.tsx");\n'''
          if source.count(old) != 1:
              raise SystemExit('audio test player runtime fixture match failed')
          source = source.replace(old, new, 1)
          old = '''  assert.match(app, /AudioEffectRuntime/);\n  assert.match(app, /audioEffectRuntimeRef/);\n'''
          new = '''  assert.match(playerRuntime, /new AudioEffectRuntime\\(\\)/);\n  assert.match(playerRuntime, /audioEffectRuntimeRef/);\n  assert.doesNotMatch(app, /import \\{ AudioEffectRuntime \\}/);\n  assert.doesNotMatch(app, /new AudioEffectRuntime\\(\\)/);\n  assert.match(app, /audioEffectRuntimeRef/);\n'''
          if source.count(old) != 1:
              raise SystemExit('audio ownership assertions match failed')
          source = source.replace(old, new, 1)
          old = '''  assert.match(lifecycle, /repairPlaybackAfterAppReturnsRef\\.current\\s*=\\s*repairPlaybackAfterAppReturns/);\n  assert.match(lifecycle, /repairPlaybackAfterAppReturnsRef\\.current\\(reason\\)/);\n'''
          new = '''  assert.match(lifecycle, /useLayoutEffect\\(\\(\\) => \\{/);\n  assert.match(lifecycle, /repairPlaybackAfterAppReturnsRef\\.current\\s*=\\s*repairPlaybackAfterAppReturns/);\n  assert.match(lifecycle, /repairPlaybackAfterAppReturnsRef\\.current\\(reason\\)/);\n'''
          if source.count(old) != 1:
              raise SystemExit('lifecycle assertions match failed')
          tests.write_text(source.replace(old, new, 1))
          PY

      - name: Normalize CSS after hygiene writer fix
        run: npm run css:dedup:fix

      - name: Remove temporary workflow from merge candidate
        run: |
          rm -f .github/workflows/final-player-cleanup.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Verify exact final tree
        run: npm run hardening:check

      - name: Commit and push verified final tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'player: finish audio runtime ownership and CSS hygiene'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/css-audio-stability
