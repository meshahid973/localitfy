name: Deep cleanup final validation

on:
  push:
    branches: [agent/deep-css-react-cleanup]

permissions:
  contents: write

concurrency:
  group: deep-cleanup-final
  cancel-in-progress: true

jobs:
  verify-final-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: agent/deep-css-react-cleanup
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove validation workflow from candidate
        run: |
          rm -f .github/workflows/deep-cleanup-final.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Verify exact final tree and lazy boundary
        run: |
          git diff --check
          set -o pipefail
          npm run hardening:check 2>&1 | tee /tmp/localtify-hardening.log
          if grep -q 'INEFFECTIVE_DYNAMIC_IMPORT' /tmp/localtify-hardening.log; then
            echo 'Ineffective dynamic import warning returned.' >&2
            exit 1
          fi
          node scripts/check-codebase-hygiene.mjs

      - name: Commit workflow removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove final cleanup validator'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/deep-css-react-cleanup
