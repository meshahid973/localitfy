name: R1 Body Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: r1-body-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r1-body-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply body-runtime extraction
        run: node scripts/r1/apply-body-runtime-extraction.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Localtify
        run: |
          npm run check
          npm run performance:check

      - name: Commit validated extraction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Body runtime extraction is already applied."
            exit 0
          fi
          git config user.name "OpenAI R1 Body Runtime"
          git config user.email "noreply@openai.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "R1: extract App body runtime effects"
          git push origin HEAD:agent/r1-body-runtime
