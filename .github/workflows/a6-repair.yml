name: a6-repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a6-repair.yml
      - scripts/apply-a6-repair.py
      - electron/runtime/updater.cjs

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-a6-repair.py
      - run: node --check electron/main.cjs
      - run: node --check electron/runtime/updater.cjs
      - run: npm ci
      - run: npm run release:check
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.cjs electron/runtime/updater.cjs scripts/check-performance-budgets.mjs tests/phase3/updater-runtime.test.mjs
          git commit -m "electron updater extracted"
          git push origin HEAD:main
