name: Phase 2 Downloads Runtime Stage

on:
  pull_request:
    branches:
      - agent/phase-2-feature-rebirth
    paths:
      - .github/workflows/phase2-download-runtime-stage.yml
      - scripts/.phase2-download-runtime.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate downloads runtime extraction
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-download-runtime-stage
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct exact patch
        shell: bash
        run: |
          cp scripts/.phase2-download-runtime.b64 /tmp/phase2-download-runtime.b64
          echo "46d269c1a91e13e1d599baec4490dc1206a49fd1dd93a6bbc3db8a221427373c  /tmp/phase2-download-runtime.b64" | sha256sum -c -
          base64 -d /tmp/phase2-download-runtime.b64 | gunzip > /tmp/phase2-download-runtime.patch
          patch -p1 < /tmp/phase2-download-runtime.patch

      - name: Verify feature ownership
        shell: bash
        run: |
          test -e src/features/downloads/useDownloadsRuntime.ts
          test "$(wc -l < src/App.tsx)" -lt 11500
          ! grep -n '@ts-nocheck' src/features/downloads/useDownloadsRuntime.ts
          grep -q 'useDownloadsRuntime' src/App.tsx
          ! grep -q 'function updateSpotifyConnectionState' src/App.tsx
          ! grep -q 'async function fetchSpotifyTracks' src/App.tsx

      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci --ignore-scripts; then
            echo "package-lock install failed; using package.json fallback for validation"
            rm -rf node_modules
            npm install --ignore-scripts --package-lock=false
          fi

      - name: Check Electron bridge drift
        run: npm run bridge:check

      - name: Check architecture boundaries
        run: npm run boundaries:check

      - name: TypeScript
        run: npm run typecheck

      - name: Production renderer build
        run: npm run build

      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          test "$(wc -l < src/App.tsx)" -lt 11500

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/downloads
          if git diff --cached --quiet; then
            echo "No source changes generated"
            exit 1
          fi
          git commit -m "refactor: move downloads runtime into feature ownership"
          git push origin HEAD:agent/phase-2-download-runtime-stage
