name: Blue screen recovery temp

on:
  push:
    branches: [agent/fix-blue-screen-ownership]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-blue-screen-ownership
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize Electron pixelart helper ownership fix
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'electron/main.cjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = 'const { createUserDataRuntime } = require("./runtime/user-data.cjs");';
          const after = 'const { uniquePaths, createUserDataRuntime } = require("./runtime/user-data.cjs");';
          if (source.includes(after)) process.exit(0);
          if (!source.includes(before)) throw new Error('user-data runtime import shape changed unexpectedly');
          fs.writeFileSync(file, source.replace(before, after), 'utf8');
          NODE
      - name: Live Electron renderer smoke
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 > /tmp/localtify-vite.log 2>&1 &
          VITE_PID=$!
          ./node_modules/.bin/wait-on tcp:5173
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox --remote-debugging-port=9222 . > /tmp/localtify-electron.log 2>&1 &
          ELECTRON_PID=$!
          cleanup() {
            kill "$ELECTRON_PID" 2>/dev/null || true
            kill "$VITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! node scripts/renderer-smoke-temp.cjs; then
            echo '--- electron log ---'
            cat /tmp/localtify-electron.log || true
            echo '--- vite log ---'
            cat /tmp/localtify-vite.log || true
            exit 1
          fi
      - name: Remove temporary validation files
        run: |
          rm -f .github/workflows/blue-screen-recovery-temp.yml
          rm -f scripts/renderer-smoke-temp.cjs
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Full hardening on final tree
        run: |
          git diff --check
          npm run hardening:check
      - name: Commit verified recovery and temporary-file removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover renderer styles and pixelart path runtime'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/fix-blue-screen-ownership
