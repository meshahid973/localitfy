name: CSS debt one-shot

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - ready_for_review
  push:
    branches:
      - agent/css-debt-cleanup

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/css-debt-cleanup
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize fixed-point CSS cleanup
        id: css
        shell: bash
        run: |
          set -o pipefail
          npm run css:dedup:fix 2>&1 | tee css-cleanup.log

      - name: Verify hardening gate
        id: hardening
        shell: bash
        run: |
          set -o pipefail
          npm run hardening:check 2>&1 | tee hardening.log

      - name: Commit generated CSS cleanup
        if: success()
        shell: bash
        run: |
          git add -- ':(glob)src/**/*.css' 'src/*.css'
          if git diff --cached --quiet; then
            echo 'No CSS changes remained after fixed-point cleanup.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R4: materialize CSS duplicate cleanup'
          git push origin HEAD:agent/css-debt-cleanup

      - name: Report one-shot result on PR 38
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### CSS debt one-shot result'
            echo
            echo "- CSS cleanup: **${{ steps.css.outcome }}**"
            echo "- hardening: **${{ steps.hardening.outcome }}**"
            echo
            if [ -f css-cleanup.log ]; then
              echo '<details><summary>CSS cleanup tail</summary>'
              echo
              echo '```text'
              tail -n 80 css-cleanup.log
              echo '```'
              echo '</details>'
            fi
            if [ -f hardening.log ]; then
              echo
              echo '<details><summary>Hardening tail</summary>'
              echo
              echo '```text'
              tail -n 120 hardening.log
              echo '```'
              echo '</details>'
            fi
          } > one-shot-report.md
          gh pr comment 38 --repo meshahid973/localitfy --body-file one-shot-report.md
