name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: localtify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Renderer validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Electron bridge drift
        run: npm run bridge:check

      # Phase 1 starts by exposing existing TypeScript debt without blocking the
      # stable renderer build. Remove continue-on-error once the baseline is
      # clean; new/extracted modules must still be typed.
      - name: TypeScript baseline
        continue-on-error: true
        run: npm run typecheck

      - name: Build renderer
        run: npm run build
