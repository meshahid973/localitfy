name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: localtify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Renderer validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check Electron bridge drift
        run: npm run bridge:check

      - name: Check architecture boundaries
        run: npm run boundaries:check

      - name: Node tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: Database migration and backup restore
        run: npm run db:recovery-test

      - name: Performance budgets
        run: npm run performance:check
