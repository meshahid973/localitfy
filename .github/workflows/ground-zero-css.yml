name: ground zero css

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ground-zero-css.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare safe cleanup
        run: |
          node scripts/patch-ground-zero-css-script.mjs
          node --check scripts/apply-ground-zero-css.mjs
      - name: Apply ground zero cleanup
        run: node scripts/apply-ground-zero-css.mjs
      - name: Install dependencies
        run: npm ci
      - name: Deduplicate CSS
        run: npm run css:dedup:fix
      - name: Validate release
        run: npm run release:check
      - name: Commit validated cleanup
        run: |
          git checkout -- scripts/apply-ground-zero-css.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "css ground zero fixed"
          git push origin HEAD:main
