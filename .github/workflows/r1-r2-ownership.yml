name: R1 R2 Ownership

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: r1-r2-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r1-r2-ownership
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rewrite App imports to canonical owners
        run: node scripts/r1-r2/apply-app-ownership.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Localtify
        run: |
          npm run check
          npm run performance:check

      - name: Commit validated ownership migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Ownership migration is already applied."
            exit 0
          fi
          git config user.name "OpenAI R1 R2 Ownership"
          git config user.email "noreply@openai.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "R2: import App dependencies from canonical owners"
          git push origin HEAD:agent/r1-r2-ownership
