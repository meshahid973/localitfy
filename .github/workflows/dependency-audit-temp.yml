name: Dependency security finish

on:
  push:
    branches: [agent/deep-css-react-cleanup]

permissions:
  contents: write

concurrency:
  group: dependency-security-finish
  cancel-in-progress: true

jobs:
  upgrade-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-css-react-cleanup
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade sharp to patched line
        run: npm install --save-dev sharp@0.35.3
      - name: Exercise the sharp asset pipeline
        run: npm run assets:compress:dry
      - name: Remove temporary workflow from final tree
        run: |
          rm -f .github/workflows/dependency-audit-temp.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Verify security and full hardening
        run: |
          git diff --check
          npm audit --audit-level=high
          npm run hardening:check
          node scripts/check-codebase-hygiene.mjs
      - name: Commit verified dependency fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: upgrade sharp and finish deep cleanup'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/deep-css-react-cleanup
