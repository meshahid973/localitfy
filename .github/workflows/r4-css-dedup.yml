name: R4 CSS Dedup

on:
  push:
    branches:
      - agent/r4-css-dedup

permissions:
  contents: write

concurrency:
  group: r4-css-dedup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4-css-dedup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove fully shadowed CSS blocks
        run: node scripts/css-shadow-dedup.mjs --write

      - name: Confirm duplicate guard is clean
        run: node scripts/css-shadow-dedup.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Localtify
        run: |
          npm run check
          npm run performance:check

      - name: Commit validated CSS cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No CSS cleanup required."
            exit 0
          fi
          git config user.name "OpenAI R4 CSS Cleanup"
          git config user.email "noreply@openai.com"
          git add -- ':(glob)src/**/*.css'
          git diff --cached --check
          git commit -m "R4: remove shadowed CSS duplicate blocks"
          git push origin HEAD:agent/r4-css-dedup
