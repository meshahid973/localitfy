name: Phase 2 Apply Renderer Split

on:
  pull_request:
    branches:
      - agent/phase-1-foundation-reset
    paths:
      - .github/workflows/phase2-apply.yml
      - scripts/phase2-refactor.part00
      - scripts/phase2-refactor.part01
      - scripts/phase2-refactor.part02
      - scripts/phase2-refactor.part03
      - scripts/phase2-refactor.part04
      - scripts/phase2-refactor.part05
      - scripts/phase2-refactor.part06
      - scripts/phase2-refactor.part07

permissions:
  contents: write

concurrency:
  group: localtify-phase2-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Generate, validate, and commit renderer split
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-feature-rebirth
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and generate Phase 2 renderer split
        shell: bash
        run: |
          cat scripts/phase2-refactor.part0{0,1,2,3,4,5,6,7} > /tmp/phase2-refactor.b64
          echo "bb6803f492f14d75fd15d822ec22ea6f747d96701e2ee3695e3d71d9577a219d  /tmp/phase2-refactor.b64" | sha256sum -c -
          base64 -d /tmp/phase2-refactor.b64 > scripts/phase2-renderer-refactor.py
          python scripts/phase2-renderer-refactor.py
          rm scripts/phase2-renderer-refactor.py
          test "$(wc -l < src/LocaltifyAppView.tsx)" -lt 2000

      - name: Normalize generated feature contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def drop_bindings(path, names):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              cleaned = []
              for line in lines:
                  if line.startswith("    ") and line.strip().rstrip(",") in names:
                      continue
                  cleaned.append(line)
              p.write_text("\n".join(cleaned) + "\n", encoding="utf-8")

          drop_bindings("src/features/albums/AlbumsView.tsx", {"ready"})
          drop_bindings("src/features/analytics/AnalyticsView.tsx", {"ready"})
          drop_bindings("src/features/covers/CoversView.tsx", {"now"})
          drop_bindings("src/features/downloads/DownloadsView.tsx", {"downloadResults", "playlists", "progress", "ready"})
          drop_bindings("src/features/home/HomeView.tsx", {"now"})
          drop_bindings("src/features/library/LibraryView.tsx", {"now", "playlists"})
          drop_bindings("src/features/playlists/PlaylistsView.tsx", {"playlists", "selectedPlaylistId"})

          p = Path("src/features/albums/album.runtime.ts")
          s = p.read_text(encoding="utf-8").replace(
              'import { prettyMeta, prettyTitle } from "../search/search.utils";',
              'import { prettyMeta } from "../search/search.utils";'
          )
          p.write_text(s, encoding="utf-8")

          p = Path("src/features/albums/index.ts")
          s = p.read_text(encoding="utf-8").replace('export * from "./album.utils";\n', '')
          p.write_text(s, encoding="utf-8")

          p = Path("src/features/library/components/SongRows.tsx")
          s = p.read_text(encoding="utf-8").replace(
              '  onOpenEditor: (song: Song) => void;',
              '  onOpenEditor?: (song: Song) => void;'
          )
          p.write_text(s, encoding="utf-8")

          p = Path("src/features/playlists/components/VirtualPlaylistTrackList.tsx")
          s = p.read_text(encoding="utf-8").replace(
              'import { collapseSpaces, formatTime, lower } from "../../../shared/utils/format";',
              'import { formatTime } from "../../../shared/utils/format";'
          )
          p.write_text(s, encoding="utf-8")

          p = Path("src/shared/ui/LocaltifyViewUi.tsx")
          s = p.read_text(encoding="utf-8").replace(
              '  cute = false,\n  badge = "♪",\n  mascotState',
              '  cute = false,\n  mascotState'
          )
          p.write_text(s, encoding="utf-8")

          p = Path("src/features/shell/TitleBar.tsx")
          s = p.read_text(encoding="utf-8")
          s = s.replace('export function TitleBar(', 'export default function TitleBar(', 1)
          if 'export default function TitleBar(' not in s:
              s = s.replace('function TitleBar(', 'export default function TitleBar(', 1)
          p.write_text(s, encoding="utf-8")

          app = Path("src/App.tsx").read_text(encoding="utf-8")
          assert app.count("LOCALITFY_DOWNLOAD_URL") >= 1, "expected Localtify compatibility symbol missing from App"
          assert "LOCALITIFY_DOWNLOAD_URL" not in app, "incorrect Localitify spelling leaked into App"
          constants = Path("src/localtifyConstants.ts").read_text(encoding="utf-8")
          assert "export const LOCALITFY_DOWNLOAD_URL" in constants, "compatibility export missing"
          discord_constants = Path("src/features/discord/discord.constants.ts").read_text(encoding="utf-8")
          assert "export const LOCALITFY_DOWNLOAD_URL" in discord_constants, "canonical Discord export missing"
          PY

      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci --ignore-scripts; then
            echo "package-lock install failed; using package.json fallback for validation"
            rm -rf node_modules
            npm install --ignore-scripts --package-lock=false
          fi

      - name: Check Electron bridge drift
        run: npm run bridge:check

      - name: Check architecture boundaries
        run: npm run boundaries:check

      - name: TypeScript
        run: npm run typecheck

      - name: Production renderer build
        run: npm run build

      - name: Diff integrity
        shell: bash
        run: |
          git diff --check
          test ! -e scripts/phase2-renderer-refactor.py
          ! grep -R --line-number --include='*.ts' --include='*.tsx' 'from .*LocaltifyAppView' src/features src/shared src/core src/platform src/types

      - name: Commit validated renderer split
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No generated source changes"
            exit 1
          fi
          git commit -m "refactor: split renderer into feature views"
          git push origin HEAD:agent/phase-2-feature-rebirth
