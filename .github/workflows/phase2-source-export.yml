name: Phase 2 Source Export

on:
  pull_request:
    branches:
      - agent/phase-1-foundation-reset

permissions:
  contents: read

jobs:
  export-source:
    name: Export refactor sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Phase 2 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase2-full-source
          if-no-files-found: error
          retention-days: 1
          path: |
            src/**
            scripts/**
            .github/workflows/ci.yml
            package.json
            package-lock.json
            tsconfig*.json
            vite.config.ts
