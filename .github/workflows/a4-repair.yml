name: a4-repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a4-repair.yml
      - scripts/apply-a4-repair.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-a4-repair.py
      - run: node --check electron/downloader.cjs
      - run: node --check electron/runtime/yt-dlp.cjs
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run release:check
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json electron/downloader.cjs electron/runtime/yt-dlp.cjs tests/phase3/dependency-hardening.test.mjs
          git commit -m "dependency hardening fixed"
          git push origin HEAD:main
