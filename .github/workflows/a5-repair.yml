name: a5-repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a5-repair.yml
      - scripts/apply-a5-repair.py
      - scripts/fix-a5-volume.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-a5-repair.py
      - name: Scope strict bridge check
        run: node -e "const fs=require('fs'); const p='tsconfig.bridge.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.include=[]; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"
      - run: python scripts/fix-a5-volume.py
      - run: npm ci
      - run: npm run release:check
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/localitfy.d.ts tsconfig.bridge.json electron/main.cjs tests/phase3/bridge-types.test.mjs
          git commit -m "bridge typing fixed"
          git push origin HEAD:main
