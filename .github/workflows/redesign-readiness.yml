name: redesign readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/redesign-readiness.yml
      - scripts/apply-redesign-readiness.mjs
      - scripts/fix-redesign-readiness.mjs
      - scripts/fix-redesign-ownership-tests.mjs

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply audited repair
        run: |
          node scripts/apply-redesign-readiness.mjs
          node scripts/fix-redesign-readiness.mjs
          node scripts/fix-redesign-ownership-tests.mjs
      - name: Hide temporary workflows during validation
        run: |
          mv .github/workflows/redesign-audit.yml /tmp/redesign-audit.yml
          mv .github/workflows/redesign-readiness.yml /tmp/redesign-readiness.yml
      - name: Install dependencies
        run: npm ci
      - name: Deduplicate CSS
        run: npm run css:dedup:fix
      - name: Validate release
        run: npm run release:check
      - name: Validate Discord Activity
        working-directory: discord-activity
        run: npm ci && npm run build
      - name: Restore temporary workflows
        run: |
          mv /tmp/redesign-audit.yml .github/workflows/redesign-audit.yml
          mv /tmp/redesign-readiness.yml .github/workflows/redesign-readiness.yml
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "redesign readiness fixed"
          git push origin HEAD:main
