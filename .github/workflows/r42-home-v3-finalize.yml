name: r42 Home v3 finalizer

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/perf-css-ownership-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/perf-css-ownership-repair
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply final Home migration
        run: node scripts/r42-finalize-home-v3.mjs

      - name: Deterministic CSS cleanup
        run: npm run css:dedup:fix

      - name: Remove one-shot scaffolding before validation
        run: |
          rm -f .github/workflows/r42-home-v3-finalize.yml
          rm -f scripts/r42-finalize-home-v3.mjs

      - name: Full release gate
        run: npm run release:check

      - name: Static Home ownership smoke
        run: |
          grep -q 'className="homePage"' src/features/home/HomeView.tsx
          grep -q 'className="homeHero' src/features/home/HomeView.tsx
          grep -q 'className="homeListenGrid"' src/features/home/HomeView.tsx
          grep -q 'className="homeRotationRail"' src/features/home/HomeView.tsx
          ! grep -qi 'quick library' src/features/home/HomeView.tsx
          ! grep -q 'homeExpanded' src/App.tsx
          ! grep -q 'quickLibraryMoreBlur' src/App.tsx
          ! grep -q 'showHomeSideCards' src/App.tsx
          ! grep -q 'homeDashboardClass' src/App.tsx

      - name: Commit verified candidate
        run: |
          git config user.name "localtify-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ui: finalize Home v3 redesign"
          git push origin HEAD:agent/perf-css-ownership-repair
