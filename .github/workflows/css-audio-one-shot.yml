name: CSS audio one-shot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: css-audio-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-verify-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/css-audio-stability'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/css-audio-stability
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tighten temporary migration guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate-player-audio-runtime.mjs')
          source = path.read_text()
          old = 'if (source.includes(deadName)) throw new Error(`[audio-migration] stale legacy symbol remains: ${deadName}`);'
          new = 'if (source.includes(`function ${deadName}(`) || source.includes(`const ${deadName} =`)) throw new Error(`[audio-migration] stale legacy declaration remains: ${deadName}`);'
          if old not in source:
              raise SystemExit('migration guard source not found')
          path.write_text(source.replace(old, new))
          PY

      - name: Materialize audio runtime ownership
        run: node scripts/migrate-player-audio-runtime.mjs

      - name: Remove legacy duplicate audio-effects card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/App.tsx')
          source = path.read_text()
          pattern = r'\n  function renderAudioEffectsCard\(\) \{.*?\n  function renderSettingsCategoryContent\(\) \{'
          replacement = '\n\n  function renderSettingsCategoryContent() {'
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one legacy audio-effects card, found {count}')
          marker = '\n        {renderAudioEffectsCard()}'
          if marker not in source:
              raise SystemExit('legacy audio-effects render call not found')
          source = source.replace(marker, '', 1)
          if 'getAudioEffectMode()' in source:
              raise SystemExit('stale getAudioEffectMode call remains after legacy card removal')
          path.write_text(source)
          PY

      - name: Materialize CSS ownership
        run: node scripts/migrate-css-ownership.mjs

      - name: Remove duplicate legacy onboarding CSS import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Onboarding.tsx')
          source = path.read_text()
          old = 'import "./onboarding-first-run.css";\n'
          if old not in source:
              raise SystemExit('legacy Onboarding CSS import not found')
          path.write_text(source.replace(old, '', 1))
          PY

      - name: Clean CSS to fixed point
        run: npm run css:dedup:fix

      - name: Remove one-shot scaffolding from merge candidate
        run: |
          rm -f .github/workflows/css-audio-one-shot.yml
          rm -f scripts/migrate-player-audio-runtime.mjs scripts/migrate-css-ownership.mjs
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Verify full hardening gate
        run: npm run hardening:check

      - name: Commit final cleanup tree
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes remained to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'player: stabilize audio effects and organize CSS ownership'
          git push origin HEAD:agent/css-audio-stability
