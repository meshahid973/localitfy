name: install-analytics-registry-components
on:
  push:
    branches:
      - codex/analytics-updates-4-20261121
permissions:
  contents: write
jobs:
  registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install beUI original chart through Bun
        run: bunx --bun shadcn add @beui/line-chart -y --overwrite
      - name: Install Arc UI original dropdown through pnpm
        run: pnpm dlx shadcn@latest add @uiarc/dropdown-menu -y --overwrite
      - name: Place original registry source in existing vendor layout
        run: |
          mkdir -p src/vendor
          cp -a -n '@/vendor/.' src/vendor/
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path('src/vendor')
          for base in (root/'charts',root/'motion'):
            if not base.exists(): continue
            for file in base.rglob('*'):
              if file.suffix not in ('.ts','.tsx'): continue
              original=file.read_text()
              def fix(match):
                dest=Path('src/vendor')/match.group(1)
                relative=os.path.relpath(dest, file.parent).replace(os.sep,'/')
                return '"' + (relative if relative.startswith('.') else './'+relative) + '"'
              changed=re.sub(r'"@/(?:components/|vendor/)([^"]+)"',fix,original)
              def fixlib(match):
                dest=Path('src/vendor/beui/lib')/match.group(1)
                relative=os.path.relpath(dest,file.parent).replace(os.sep,'/')
                return '"' + (relative if relative.startswith('.') else './'+relative) + '"'
              changed=re.sub(r'"@/lib/([^"]+)"',fixlib,changed)
              file.write_text(changed)
          PY
          rm -rf '@'
      - name: Retain the project's npm lockfile
        run: |
          rm -f pnpm-lock.yaml bun.lock bun.lockb
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit original registry components and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.json package.json package-lock.json src/vendor src/styles
          if ! git diff --cached --quiet; then
            git commit -m "Install original Analytics registry components [registry setup]"
            git push origin HEAD:codex/analytics-updates-4-20261121
          fi
