name: quality

on:
  push:
    branches: [main]
  pull_request:

env:
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report runtime dependency advisories (advisory until triaged)
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/localtify-runtime-audit.json" || true
          node -e '
            const audit = require(process.env.RUNNER_TEMP + "/localtify-runtime-audit.json");
            if (!audit.metadata?.vulnerabilities) throw new Error("Could not retrieve dependency audit");
            console.log("[security-audit] Runtime advisories:", JSON.stringify(audit.metadata.vulnerabilities));
            for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
              if (["critical", "high", "moderate"].includes(item.severity)) {
                console.log("[security-audit]", item.severity, name, "via", item.via.map(v => typeof v === "string" ? v : v.name).join(", "));
              }
            }
          '
      - name: Block high and critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run release:check

  windows-native-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Electron runtime smoke
        timeout-minutes: 1
        run: npx electron scripts/ci-electron-smoke.cjs

  discord-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-activity
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-activity/package-lock.json
      - run: npm ci
      - run: npm run build
