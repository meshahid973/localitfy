name: quality

on:
  push:
    branches: [main]
  pull_request:

env:
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      # Only profile the explicitly scoped Performance 4.0 branch. No recurring
      # 100k-song benchmark cost on unrelated PRs or main pushes.
      - name: Profile 10k and 100k song workloads against this PR's base
        if: ${{ startsWith(github.head_ref, 'codex/performance-4-') }}
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-performance
          git worktree add --detach "$RUNNER_TEMP/localtify-perf-baseline" "$BASELINE_SHA"
          for count in 10000 100000; do
            for round in 1 2; do
              if [[ "$round" == 1 ]]; then order="baseline current"; else order="current baseline"; fi
              for kind in $order; do
                src=.
                if [[ "$kind" == baseline ]]; then src="$RUNNER_TEMP/localtify-perf-baseline"; fi
                node --expose-gc scripts/benchmark-library-workloads.mjs "$src" "$count" > "qa-performance/$kind-$count-$round.json"
              done
            done
          done
          node -e 'const fs=require("fs"); const read=(k,n,r)=>JSON.parse(fs.readFileSync("qa-performance/"+k+"-"+n+"-"+r+".json")); for(const n of [10000,100000]){for(let r=1;r<=2;r++){const a=read("baseline",n,r),b=read("current",n,r);for(let i=0;i<a.trials.length;i++){if(a.trials[i].label!==b.trials[i].label||a.trials[i].digest!==b.trials[i].digest)throw Error("Workload correctness diverged: "+n+"/"+r+"/"+i); console.log(JSON.stringify({tracks:n,round:r,workload:a.trials[i].label,baselineMs:a.trials[i].wallMs,candidateMs:b.trials[i].wallMs,baselineHeapMiB:a.trials[i].heapDeltaMiB,candidateHeapMiB:b.trials[i].heapDeltaMiB}));}}}'
      - name: Preserve optional Performance 4.0 measurements
        if: ${{ always() && startsWith(github.head_ref, 'codex/performance-4-') }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-4-profile
          path: qa-performance/
          if-no-files-found: warn

      - name: Report production dependency advisories
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/localtify-runtime-audit.json" || true
          node -e '
            const audit = require(process.env.RUNNER_TEMP + "/localtify-runtime-audit.json");
            if (!audit.metadata?.vulnerabilities) throw new Error("Could not retrieve dependency audit");
            console.log("[security-audit] Runtime advisories:", JSON.stringify(audit.metadata.vulnerabilities));
            for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
              if (["critical", "high", "moderate"].includes(item.severity)) {
                console.log("[security-audit]", item.severity, name, "via", item.via.map(v => typeof v === "string" ? v : v.name).join(", "));
              }
            }
          '
      - name: Block moderate, high and critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit shipped Electron and report build-tool advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/localtify-full-audit.json" || true
          node scripts/check-shipped-runtime-audit.mjs "$RUNNER_TEMP/localtify-full-audit.json"
      - name: Preserve full dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            ${{ runner.temp }}/localtify-runtime-audit.json
            ${{ runner.temp }}/localtify-full-audit.json
          if-no-files-found: warn
      - name: Verify full dependency audit
        run: npm audit --audit-level=moderate
      # Retain the failed audit gate, but collect independent build/test results too.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run release:check

  windows-native-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:quick
      - run: npm run build
      - name: Electron runtime smoke
        timeout-minutes: 1
        run: npx electron scripts/ci-electron-smoke.cjs
      - name: Rendered desktop layout and playback regression
        timeout-minutes: 4
        env:
          LOCALTIFY_QA_OUTPUT: ${{ runner.temp }}/localtify-desktop-qa
        run: npx electron scripts/ci-desktop-regression.cjs
      - name: Preserve desktop screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rendered-qa
          path: ${{ runner.temp }}/localtify-desktop-qa
          if-no-files-found: warn

  discord-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-activity
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-activity/package-lock.json
      - run: npm ci
      - run: npm run build
