name: quality

on:
  push:
    branches: [main]
  pull_request:

env:
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Report production dependency advisories
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/localtify-runtime-audit.json" || true
          node -e '
            const audit = require(process.env.RUNNER_TEMP + "/localtify-runtime-audit.json");
            if (!audit.metadata?.vulnerabilities) throw new Error("Could not retrieve dependency audit");
            console.log("[security-audit] Runtime advisories:", JSON.stringify(audit.metadata.vulnerabilities));
            for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
              if (["critical", "high", "moderate"].includes(item.severity)) {
                console.log("[security-audit]", item.severity, name, "via", item.via.map(v => typeof v === "string" ? v : v.name).join(", "));
              }
            }
          '
      - name: Block moderate, high and critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit shipped Electron and report build-tool advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/localtify-full-audit.json" || true
          node scripts/check-shipped-runtime-audit.mjs "$RUNNER_TEMP/localtify-full-audit.json"
      - name: Preserve full dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            ${{ runner.temp }}/localtify-runtime-audit.json
            ${{ runner.temp }}/localtify-full-audit.json
          if-no-files-found: warn
      - name: Verify full dependency audit
        run: npm audit --audit-level=moderate
      # Retain the failed audit gate, but collect independent build/test results too.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run release:check

  windows-native-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:quick
      - run: npm run build
      - name: Electron runtime smoke
        timeout-minutes: 1
        run: npx electron scripts/ci-electron-smoke.cjs
      - name: Rendered desktop layout and playback regression
        timeout-minutes: 4
        env:
          LOCALTIFY_QA_OUTPUT: ${{ runner.temp }}/localtify-desktop-qa
        run: npx electron scripts/ci-desktop-regression.cjs
      - name: Preserve desktop screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rendered-qa
          path: ${{ runner.temp }}/localtify-desktop-qa
          if-no-files-found: warn

  discord-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-activity
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-activity/package-lock.json
      - run: npm ci
      - run: npm run build
