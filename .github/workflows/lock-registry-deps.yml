name: Sync Downloads 4.0 dependency lock
on:
  push:
    branches: [codex/artwork-downloads-refinement-20261121]
    paths:
      - package.json
      - src/vendor/**
      - .github/workflows/lock-registry-deps.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update deterministic npm dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only regenerated package-lock.json
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lock changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Resolve Downloads 4.0 component dependencies"
          git push origin HEAD:codex/artwork-downloads-refinement-20261121
