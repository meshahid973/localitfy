name: R6 Materialize Source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: r6-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6-electron-sandbox
          fetch-depth: 0

      - name: Materialize validated refactors
        run: |
          node scripts/r1/apply-diagnostics-extraction.mjs
          node scripts/r6/apply-electron-sandbox.mjs
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source is already materialized."
            exit 0
          fi
          git config user.name "OpenAI R6 Materializer"
          git config user.email "noreply@openai.com"
          git add electron/main.cjs src/App.tsx tests/phase3/hardening.test.mjs docs/architecture/electron-sandbox.md
          git diff --cached --check
          git commit -m "R6: materialize sandboxed renderer hardening"
          git push origin HEAD:agent/r6-electron-sandbox
