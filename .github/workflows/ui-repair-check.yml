name: UI repair check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-repair-check.yml"
      - "scripts/organize-ui.py"

permissions:
  contents: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply organization migration
        run: python scripts/organize-ui.py
      - run: npm ci
      - name: Remove exact cross-file CSS shadows
        run: |
          node scripts/css-cross-file-dedup.mjs --write
          node scripts/css-hygiene.mjs --write
          git diff --stat
      - name: Validate final repository shape
        run: |
          rm -f .github/workflows/ui-repair-check.yml scripts/organize-ui.py
          npm run release:check
          git diff --check
      - name: Commit validated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src scripts/check-release-ui-ownership.mjs
          git diff --cached --stat
          git commit -m "css organization fixed"
          git push origin HEAD:main
