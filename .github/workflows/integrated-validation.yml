name: integrated-validation
# Cancel outdated automatic PR validation; preserve intentionally separate manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Extended cross-platform benchmarks are intentionally opt-in. Normal PRs run
# quality.yml. Invoke this before merging changes to media, sync, native runtimes,
# caching, Android integration or large-library performance.
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline branch or commit (must differ from candidate)
        default: origin/main
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/integrated-validation.yml'
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check live public artwork providers (advisory)
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p qa-artifacts
          node scripts/live-artwork-check.cjs | tee qa-artifacts/live-artwork.json
      - name: Compare production library modules with the PR baseline
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.baseline_ref }}
        shell: bash
        run: |
          mkdir -p qa-artifacts
          BASELINE_SHA="$(git rev-parse --verify "$BASELINE_REF^{commit}")"
          test "$BASELINE_SHA" != "$(git rev-parse HEAD)" || { echo "Select a different baseline commit"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/localtify-baseline" "$BASELINE_SHA"
          # Fresh Node processes and alternating order reduce warm-cache/order bias.
          for n in 1000 10000 50000 100000; do
            for round in 1 2 3; do
              if [ "$round" -eq 2 ]; then order="current baseline"; else order="baseline current"; fi
              for kind in $order; do
                target=.
                if [ "$kind" = baseline ]; then target="$RUNNER_TEMP/localtify-baseline"; fi
                node --expose-gc scripts/benchmark-library-workloads.mjs "$target" "$n" | tee "qa-artifacts/$kind-$n-$round.json"
              done
            done
          done
          node -e 'const fs=require("fs"),read=(k,n,r)=>JSON.parse(fs.readFileSync("qa-artifacts/"+k+"-"+n+"-"+r+".json")),median=v=>v.slice().sort((a,b)=>a-b)[1];for(const n of [1000,10000,50000,100000]){const a=[1,2,3].map(r=>read("baseline",n,r)),b=[1,2,3].map(r=>read("current",n,r));for(const v of [...a,...b])for(let i=0;i<a[0].trials.length;i++)if(v.trials[i].digest!==a[0].trials[i].digest)throw Error("Output divergence: "+n+" "+a[0].trials[i].label);for(const [kind,rows] of [["baseline",a],["current",b]]){const result={...rows[0],peakRssMiB:median(rows.map(x=>x.peakRssMiB)),rounds:3,trials:rows[0].trials.map((t,i)=>({...t,...Object.fromEntries(["wallMs","cpuMs","heapDeltaMiB","rssMiB","rssDeltaMiB"].map(key=>[key,median(rows.map(x=>x.trials[i][key]))]))}))};fs.writeFileSync("qa-artifacts/"+kind+"-"+n+".json",JSON.stringify(result,null,2));console.log(JSON.stringify(result));}}'
      - name: Actual Electron desktop renderer and audio smoke
        shell: bash
        run: |
          # Electron may install its executable lazily. Resolve the runtime before
          # configuring its sandbox; never disable the sandbox to make CI pass.
          node node_modules/electron/install.js
          sandbox="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%a' "$sandbox")" = "0:4755"
          # Hosted Linux runners have no physical sound card. Use a real PulseAudio null sink.
          if ! command -v pulseaudio >/dev/null; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 pulseaudio
          fi
          pulseaudio --start
          pactl load-module module-null-sink sink_name=localtify_ci
          pactl set-default-sink localtify_ci
          baseline="$RUNNER_TEMP/localtify-baseline"
          # Measure both revisions with the same harness and runner. Do not
          # reuse installed modules if their lockfiles differ.
          if cmp -s package-lock.json "$baseline/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          else
            npm --prefix "$baseline" ci
            (cd "$baseline" && node node_modules/electron/install.js)
            sandbox="$(cd "$baseline" && node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
            test -f "$sandbox"
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi
          npm --prefix "$baseline" run build
          cp scripts/ci-desktop-regression.cjs "$baseline/scripts/ci-desktop-regression.cjs"
          (
            cd "$baseline"
            LOCALTIFY_QA_OUTPUT="$GITHUB_WORKSPACE/qa-artifacts/desktop-baseline" xvfb-run -a npx electron scripts/ci-desktop-regression.cjs
          )
          xvfb-run -a npx electron scripts/ci-desktop-regression.cjs
          node -e 'const fs=require("fs");const read=p=>JSON.parse(fs.readFileSync(p));const comparison={baseline:read("qa-artifacts/desktop-baseline/desktop-runtime.json"),candidate:read("qa-artifacts/desktop-runtime.json")};fs.writeFileSync("qa-artifacts/desktop-comparison.json",JSON.stringify(comparison,null,2));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-desktop-and-benchmarks
          path: qa-artifacts/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK and run Android checks
        shell: bash
        run: |
          mkdir -p qa-android
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          # Maven Central may throttle shared hosted-runner IPs (HTTP 429).
          # Retry only that infrastructure failure; never hide compilation,
          # lint or unit-test failures, and retain the full Gradle diagnostics.
          for attempt in 1 2 3; do
            if bash android/gradlew -p android --max-workers=2 --no-parallel assembleDebug lintDebug testDebugUnitTest 2>&1 | tee qa-android/gradle-build.log; then
              break
            fi
            if ! grep -Eq 'Received status code 429|Too Many Requests' qa-android/gradle-build.log || [ "$attempt" -eq 3 ]; then
              echo "Android build failed; no further automatic retry is justified."
              exit 1
            fi
            echo "Maven Central rate limited this runner; retry $((attempt+1))/3."
            sleep "$((attempt * 35))"
          done
      - name: Android emulator visual smoke (not physical-device QA)
        shell: bash
        run: |
          mkdir -p qa-android
          sudo chmod 666 /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/localtify-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="$ANDROID_AVD_HOME/localtify-ci.avd"
          printf 'no\n' | avdmanager create avd -n localtify-ci -k "system-images;android-35;google_apis;x86_64" -p "$AVD" --force
          test -s "$AVD/config.ini"
          # avdmanager and emulator can resolve their default homes differently on hosted runners.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$AVD" > "$ANDROID_AVD_HOME/localtify-ci.ini"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR"
          "$EMULATOR" -list-avds | grep -Fx localtify-ci
          "$EMULATOR" -accel-check
          "$EMULATOR" -avd localtify-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > qa-android/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill || true; kill "$emulator_pid" 2>/dev/null || true; tail -n 100 qa-android/emulator.log || true' EXIT
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator exited unexpectedly"
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1"
          adb shell wm size 720x1600
          adb shell wm density 320
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 2147483647
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          # Always collect diagnostics, including on a failed UI dump.
          collect_android_diagnostics() {
            adb exec-out screencap -p > qa-android/home.png || true
            adb shell dumpsys activity activities > qa-android/activities.txt || true
            adb shell dumpsys window > qa-android/windows.txt || true
            adb shell dumpsys meminfo com.meshahid973.localitfy > qa-android/memory.txt || true
            adb shell dumpsys cpuinfo > qa-android/cpuinfo.txt || true
            adb logcat -d -t 1500 > qa-android/logcat.txt || true
          }
          trap 'collect_android_diagnostics; adb emu kill || true; kill "$emulator_pid" 2>/dev/null || true; tail -n 100 qa-android/emulator.log || true' EXIT
          adb shell am start -W -n com.meshahid973.localitfy/.MainActivity | tee qa-android/startup.txt
          # A booted emulator is not necessarily an unlocked, resumed activity.
          foreground=false
          for attempt in $(seq 1 20); do
            if adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.meshahid973.localitfy'; then
              foreground=true
              break
            fi
            sleep 2
          done
          test "$foreground" = true
          # UIAutomator can return a null root while WebView initializes or animates.
          # Require a fresh dump containing the app package; never turn a failed dump into a pass.
          captured=false
          for attempt in $(seq 1 8); do
            adb shell rm -f /sdcard/localtify-ui.xml
            if timeout 35s adb shell uiautomator dump /sdcard/localtify-ui.xml &&
               adb pull /sdcard/localtify-ui.xml qa-android/ui.xml &&
               grep -q 'package="com.meshahid973.localitfy"' qa-android/ui.xml; then
              captured=true
              break
            fi
            sleep 3
          done
          collect_android_diagnostics
          test "$captured" = true
          test -s qa-android/home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-visual
          path: qa-android/
