name: integrated-validation
on:
  pull_request:
    paths:
      - "scripts/benchmark-library-workloads.mjs"
      - "scripts/ci-desktop-regression.cjs"
      - ".github/workflows/integrated-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Compare production library modules with the Performance 3.0 baseline
        shell: bash
        run: |
          mkdir -p qa-artifacts
          git worktree add --detach "$RUNNER_TEMP/localtify-baseline" 4abd73b45b4ff1165a7e5b63098749179e2f0d7d
          for n in 1000 10000 50000 100000; do
            node --expose-gc scripts/benchmark-library-workloads.mjs "$RUNNER_TEMP/localtify-baseline" "$n" | tee "qa-artifacts/baseline-$n.json"
            node --expose-gc scripts/benchmark-library-workloads.mjs . "$n" | tee "qa-artifacts/current-$n.json"
          done
          node -e 'const fs=require("fs");for(const n of [1000,10000,50000,100000]){const a=JSON.parse(fs.readFileSync("qa-artifacts/baseline-"+n+".json"));const b=JSON.parse(fs.readFileSync("qa-artifacts/current-"+n+".json"));for(let i=0;i<a.trials.length;i++)if(a.trials[i].digest!==b.trials[i].digest)throw Error("Output divergence: "+n+" "+a.trials[i].label);}'
      - name: Actual Electron desktop renderer and audio smoke
        shell: bash
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          # Hosted Linux runners have no physical sound card. Use a real PulseAudio null sink.
          if ! command -v pulseaudio >/dev/null; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 pulseaudio
          fi
          pulseaudio --start
          pactl load-module module-null-sink sink_name=localtify_ci
          pactl set-default-sink localtify_ci
          xvfb-run -a npx electron scripts/ci-desktop-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-desktop-and-benchmarks
          path: qa-artifacts/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK and run Android checks
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          bash android/gradlew -p android assembleDebug lintDebug testDebugUnitTest
      - name: Android emulator visual smoke (not physical-device QA)
        shell: bash
        run: |
          mkdir -p qa-android
          sudo chmod 666 /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/localtify-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD="$ANDROID_AVD_HOME/localtify-ci.avd"
          printf 'no\n' | avdmanager create avd -n localtify-ci -k "system-images;android-35;google_apis;x86_64" -p "$AVD" --force
          test -s "$AVD/config.ini"
          # avdmanager and emulator can resolve their default homes differently on hosted runners.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$AVD" > "$ANDROID_AVD_HOME/localtify-ci.ini"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR"
          "$EMULATOR" -list-avds | grep -Fx localtify-ci
          "$EMULATOR" -accel-check
          "$EMULATOR" -avd localtify-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > qa-android/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill || true; kill "$emulator_pid" 2>/dev/null || true; tail -n 100 qa-android/emulator.log || true' EXIT
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator exited unexpectedly"
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1"
          adb shell wm size 720x1600
          adb shell wm density 320
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 2147483647
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          # Always collect diagnostics, including on a failed UI dump.
          collect_android_diagnostics() {
            adb exec-out screencap -p > qa-android/home.png || true
            adb shell dumpsys activity activities > qa-android/activities.txt || true
            adb shell dumpsys window > qa-android/windows.txt || true
            adb logcat -d -t 1500 > qa-android/logcat.txt || true
          }
          trap 'collect_android_diagnostics; adb emu kill || true; kill "$emulator_pid" 2>/dev/null || true; tail -n 100 qa-android/emulator.log || true' EXIT
          adb shell am start -W -n com.meshahid973.localitfy/.MainActivity
          # A booted emulator is not necessarily an unlocked, resumed activity.
          foreground=false
          for attempt in $(seq 1 20); do
            if adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.meshahid973.localitfy'; then
              foreground=true
              break
            fi
            sleep 2
          done
          test "$foreground" = true
          # UIAutomator can return a null root while WebView initializes or animates.
          # Require a fresh dump containing the app package; never turn a failed dump into a pass.
          captured=false
          for attempt in $(seq 1 8); do
            adb shell rm -f /sdcard/localtify-ui.xml
            if timeout 35s adb shell uiautomator dump /sdcard/localtify-ui.xml &&
               adb pull /sdcard/localtify-ui.xml qa-android/ui.xml &&
               grep -q 'package="com.meshahid973.localitfy"' qa-android/ui.xml; then
              captured=true
              break
            fi
            sleep 3
          done
          collect_android_diagnostics
          test "$captured" = true
          test -s qa-android/home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-visual
          path: qa-android/
