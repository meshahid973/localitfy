name: install-markdown-renderer
on:
  push:
    branches:
      - codex/analytics-updates-4-20261121
permissions:
  contents: write
jobs:
  deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install react-markdown@^10 --save --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile for safe changelog Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Install safe Markdown rendering dependency [registry setup]"
            git push origin HEAD:codex/analytics-updates-4-20261121
          fi
