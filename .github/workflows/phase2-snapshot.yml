name: Phase 2 Snapshot Export

on:
  push:
    branches:
      - agent/phase-2-feature-rebirth
    paths:
      - .github/workflows/phase2-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pack current source
        run: |
          tar -czf /tmp/localtify-phase2.tgz \
            src \
            electron \
            scripts \
            package.json \
            package-lock.json \
            tsconfig.json \
            tsconfig.app.json \
            tsconfig.node.json \
            vite.config.ts \
            eslint.config.js
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-current-source
          path: /tmp/localtify-phase2.tgz
          retention-days: 1
