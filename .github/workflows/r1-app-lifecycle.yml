name: R1 App Lifecycle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: r1-app-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r1-app-lifecycle
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply lifecycle extraction
        run: node scripts/r1/apply-app-lifecycle-runtime.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Localtify
        run: |
          npm run check
          npm run performance:check

      - name: Commit validated lifecycle extraction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Lifecycle extraction is already applied."
            exit 0
          fi
          git config user.name "OpenAI R1 Lifecycle"
          git config user.email "noreply@openai.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "R1: extract App lifecycle orchestration"
          git push origin HEAD:agent/r1-app-lifecycle
