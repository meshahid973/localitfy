name: Deep cleanup audit

on:
  push:
    branches: [agent/deep-css-react-cleanup]

permissions:
  contents: read

concurrency:
  group: deep-cleanup-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit repository debt
        run: node scripts/deep-cleanup-audit.mjs
