name: Windows Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Electron syntax smoke
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/ipc/router.cjs
          node --check electron/runtime/protocols.cjs
          node --check electron/runtime/windows.cjs
          node --check electron/runtime/services.cjs
          node --check electron/db/repositories.cjs
          node --check scripts/run-electron-node.cjs

      - name: Full runtime regression gate
        run: npm run check

      - name: Performance budgets
        run: npm run performance:check
