name: R4B CSS Property Dedup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4b-css-property-dedup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove exact duplicate CSS declarations
        run: npm run css:dedup:fix

      - name: Confirm CSS duplicate guards are clean
        run: npm run css:dedup:check

      - name: Diff sanity
        run: git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Localtify
        run: |
          npm run check
          npm run performance:check

      - name: Commit validated CSS cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No exact duplicate CSS declarations found."
            exit 0
          fi
          git config user.name "OpenAI R4B CSS Cleanup"
          git config user.email "noreply@openai.com"
          git add -- ':(glob)src/**/*.css'
          git diff --cached --check
          git commit -m "R4B: remove exact duplicate CSS declarations"
          git push origin HEAD:agent/r4b-css-property-dedup
