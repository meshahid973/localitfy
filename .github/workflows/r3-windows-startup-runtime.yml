name: R3 Windows Startup Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: r3-windows-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-windows-startup-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Windows startup extraction
        run: node scripts/r3/apply-windows-startup-runtime.mjs

      - name: Diff sanity
        run: git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Localtify
        run: |
          npm run check
          npm run performance:check

      - name: Commit validated R3 extraction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Windows startup extraction is already applied."
            exit 0
          fi
          git config user.name "OpenAI R3 Windows Runtime"
          git config user.email "noreply@openai.com"
          git add electron/main.cjs electron/native-media.cjs
          git diff --cached --check
          git commit -m "R3: centralize Windows startup integration"
          git push origin HEAD:agent/r3-windows-startup-runtime
