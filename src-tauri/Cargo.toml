[package]
name = "localtify"
version = "0.4.2"
description = "Local-first desktop music player"
authors = ["meshahid973"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "localtify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
